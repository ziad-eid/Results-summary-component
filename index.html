<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results summary component</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <main>
        <div class="result">
            <h3>Your Result</h3>
            <div class="num">
                <h1>76</h1>
                <span>of 100</span>
            </div>
            <div class="text">
                <h2>Great</h2>
                <p> You scored higher than 65% of the people who have taken these tests.</p>
            </div>
        </div>
        <div class="summary">
            <h3>Summary</h3>
            <div class="list">
                <div class="box">
                    <div><img src="../icons/icon-reaction.svg" alt="">
                        Reaction
                    </div>
                    <div><span>80</span> / 100</div>
                </div>
                <div class="box">
                    <div><img src="../icons/icon-memory.svg" alt="">
                        Memory
                    </div>
                    <div><span>92</span> / 100</div>
                </div>
                <div class="box">
                    <div><img src="../icons/icon-verbal.svg" alt="">
                        Verbal
                    </div>
                    <div><span>61</span> / 100</div>
                </div>
                <div class="box">
                    <div><img src="../icons/icon-visual.svg" alt="">
                        Visual
                    </div>
                    <div><span>73</span> / 100</div>
                </div>
            </div>
            <button>Continue</button>
        </div>
    </main>
</body>

</html>
